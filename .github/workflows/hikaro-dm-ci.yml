name: hikaro-dm CI

on:
  push:
    paths: ['hikaro-dm/**', '.github/workflows/hikaro-dm-ci.yml']
  pull_request:
    paths: ['hikaro-dm/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hikaro-dm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hikaro-dm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
